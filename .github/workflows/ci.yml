name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.10.0
      - run: make bootstrap
      - run: make core-validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.python-version == '3.13'
        with:
          name: coverage-python-3.13
          if-no-files-found: error
          path: validation_logs/coverage.xml

  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install source-QA system dependencies
        run: sudo apt-get update && sudo apt-get install --yes graphviz fontconfig fonts-noto-cjk
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.10.0
      - run: make bootstrap
      - run: .venv/bin/python scripts/qa_source.py
      - run: .venv/bin/python scripts/qa_source_lock_coverage.py
      - run: .venv/bin/python scripts/qa_upstream_contracts.py
      - run: .venv/bin/python scripts/qa_l5_evidence.py
      - run: .venv/bin/python scripts/qa_external_benchmark_contracts.py
      - run: .venv/bin/python scripts/qa_builder_contract.py
      - run: .venv/bin/python scripts/qa_content_semantics.py
      - run: .venv/bin/python scripts/qa_quarto_config.py
      - run: .venv/bin/python scripts/qa_git_index.py
      - run: make dependency-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-sbom
          if-no-files-found: error
          path: validation_logs/python-sbom.cdx.json

  canonical-publication:
    if: github.event_name != 'pull_request'
    needs: [core, source-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read canonical build metadata
        shell: bash
        run: |
          echo "BUILD_SYSTEM_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("course.toml","rb"))["build"]["system_version"])')" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(python3 -c 'import tomllib; print(tomllib.load(open("course.toml","rb"))["build"]["source_date_epoch"])')" >> "$GITHUB_ENV"
      - name: Build pinned publisher image
        run: docker build --pull=false -f Dockerfile.builder -t "ai-agent-systems-builder:${BUILD_SYSTEM_VERSION}" .
      - name: Validate all canonical publication surfaces
        run: docker run --rm -e SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" -e UV_PROJECT_ENVIRONMENT=/tmp/ai-agent-systems-venv -v "$PWD:/workspace" -w /workspace "ai-agent-systems-builder:${BUILD_SYSTEM_VERSION}" make PYTHON=/tmp/ai-agent-systems-venv/bin/python bootstrap validate-canonical manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-publication
          if-no-files-found: error
          path: |
            book/build/
            workbook/build/
            slides/*.pptx
            validation_logs/

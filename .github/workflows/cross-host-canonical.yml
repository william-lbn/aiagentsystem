name: cross-host-canonical
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: canonical-${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.10.0
      - name: Read canonical build metadata
        shell: bash
        run: |
          echo "BUILD_SYSTEM_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("course.toml","rb"))["build"]["system_version"])')" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(python3 -c 'import tomllib; print(tomllib.load(open("course.toml","rb"))["build"]["source_date_epoch"])')" >> "$GITHUB_ENV"
      - name: Build the same pinned canonical container
        run: docker build -f Dockerfile.builder -t "ai-agent-systems-builder:${BUILD_SYSTEM_VERSION}" .
      - name: Build and validate canonical artifacts
        run: docker run --rm -e SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" -e UV_PROJECT_ENVIRONMENT=/tmp/ai-agent-systems-venv -v "$PWD:/workspace" -w /workspace "ai-agent-systems-builder:${BUILD_SYSTEM_VERSION}" make PYTHON=/tmp/ai-agent-systems-venv/bin/python bootstrap validate-canonical manifest
      - name: Hash semantic release surfaces
        run: python3 scripts/hash_canonical_outputs.py --producer "${{ matrix.runner }}" --output "validation_logs/canonical-hashes-${{ matrix.runner }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-hashes-${{ matrix.runner }}
          if-no-files-found: error
          path: validation_logs/canonical-hashes-${{ matrix.runner }}.json

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: canonical-hashes-*
          path: downloaded-manifests
      - run: python3 scripts/compare_canonical_hashes.py downloaded-manifests --output cross-host-canonical-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-host-canonical-evidence
          if-no-files-found: error
          path: cross-host-canonical-evidence.json
